services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kodano
      POSTGRES_USER: kodano
      POSTGRES_PASSWORD: kodano
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodano -d kodano"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kodano
      DB_USER: kodano
      DB_PASSWORD: kodano
    ports:
      - "8080:8080"

volumes:
  postgres_data:
